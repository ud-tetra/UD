name: UD-PRED04-native-defect-and-response-microstates
on:
  pull_request:
    paths:
      - "captures/*-gpt6-pred04-native-source-*/**"
      - ".github/workflows/ud_pred04_native_selection.yml"
  workflow_dispatch:

jobs:
  native-defect-and-response-microstates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r "$CAPTURE/requirements.txt"
        env:
          CAPTURE: captures/2026-10-31T193701Z-gpt6-pred04-native-source-4e19f7
      - name: Exact conditional and finite numerical tests
        run: |
          cd "$CAPTURE"
          python native_defect_and_readout.py --out /tmp/ud_pred04_ci_results.json
          python independent_audit.py
          python -m unittest discover -v
        env:
          CAPTURE: captures/2026-10-31T193701Z-gpt6-pred04-native-source-4e19f7
      - name: Verify submitted source receipt hashes
        run: |
          python "$CAPTURE/verify_manifest.py"
        env:
          CAPTURE: captures/2026-10-31T193701Z-gpt6-pred04-native-source-4e19f7
