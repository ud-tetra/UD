name: PRED01-PRED02 conditional development replay
on:
  pull_request:
    paths:
      - "captures/2026-10-31T185600Z-gpt6-pred01-pred02-a9b2/**"
      - ".github/workflows/pred01-pred02-conditional-replay.yml"
  workflow_dispatch:

jobs:
  exact-and-synthetic-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Execute conditional mathematical model
        run: |
          python3 captures/2026-10-31T185600Z-gpt6-pred01-pred02-a9b2/pred01_pred02_replay.py --out /tmp/pred01_pred02_results.json --draws 10000 --seed 20261031
      - name: Check exact and synthetic scope
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pred01_pred02_results.json'))
          a=d['exact_audit']
          assert a['two_event_aliases']==5
          assert a['nonlinear_aliases']==4
          assert a['iid_24_minimum_expected_replays']=='92/9'
          assert a['two_pass_27_class_replays']==27
          rates=d['monte_carlo']['rates']
          assert 0 <= rates['affine']['fraction'] < 0.02
          assert 0.80 < rates['WBX1_k_half']['fraction'] < 0.99
          assert rates['WBX1_k_one']['fraction'] > 0.99
          assert rates['WBX1_k_two']['fraction'] > 0.99
          assert d['metadata']['physical_promotion']==0
          print('PASS - conditional algebra and reproducible synthetic sample; no physical bridge tested')
          PY
