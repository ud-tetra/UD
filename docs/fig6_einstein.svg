<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240">
<style>
text { font-family: serif; fill: #111; }
.label { font-size: 13px; }
.small { font-size: 11px; }
.title { font-size: 14px; font-weight: bold; }
.math { font-style: italic; font-size: 13px; }
line, path, rect, circle, polygon { stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect width="600" height="240" fill="white"/>

<text x="300" y="25" text-anchor="middle" class="title">Fig. 6. Corrected Einstein equation: four accommodation channels</text>
<g transform="translate(80,45)">
  <rect x="100" y="0" width="240" height="35" rx="5" fill="#e8f0fe" stroke="#1a3a6b" stroke-width="2"/>
  <text x="220" y="22" text-anchor="middle" class="label">G_μν = κ_G [ T^GR + ΔT^θ + ΔT^a + ΔT^c + ΔT^b ]</text>
  <line x1="140" y1="35" x2="60" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="35" x2="160" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="260" y1="35" x2="280" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="320" y1="35" x2="380" y2="70" stroke="#333" stroke-width="1"/>
  <rect x="10" y="70" width="100" height="50" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="88" text-anchor="middle" class="small" font-weight="bold">θ-channel</text>
  <text x="60" y="108" text-anchor="middle" class="small">closure-angle</text>
  <rect x="120" y="70" width="100" height="50" rx="4" fill="#e8f5e9" stroke="#1a5c3a" stroke-width="1.5"/>
  <text x="170" y="88" text-anchor="middle" class="small" font-weight="bold">a-channel</text>
  <text x="170" y="108" text-anchor="middle" class="small">packet-spacing</text>
  <rect x="230" y="70" width="100" height="50" rx="4" fill="#e8f0fe" stroke="#1a3a6b" stroke-width="1.5"/>
  <text x="280" y="88" text-anchor="middle" class="small" font-weight="bold">c-channel</text>
  <text x="280" y="108" text-anchor="middle" class="small">channel-slack</text>
  <rect x="340" y="70" width="100" height="50" rx="4" fill="#fce4ec" stroke="#880e4f" stroke-width="1.5"/>
  <text x="390" y="88" text-anchor="middle" class="small" font-weight="bold">b-channel</text>
  <text x="390" y="108" text-anchor="middle" class="small">branch</text>
  <text x="60" y="145" text-anchor="middle" class="small" fill="#888">tidal deform.</text>
  <text x="170" y="145" text-anchor="middle" class="small" fill="#888">radial profile</text>
  <text x="280" y="145" text-anchor="middle" class="small" fill="#888">precession</text>
  <text x="390" y="145" text-anchor="middle" class="small" fill="#888">ringdown</text>
</g>
<text x="300" y="220" text-anchor="middle" class="small" fill="#555">When all ΔT → 0: exact GR recovery (GR Limit Theorem).</text>

</svg>