<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340">
<style>
text { font-family: serif; fill: #111; }
.label { font-size: 13px; }
.small { font-size: 11px; }
.title { font-size: 14px; font-weight: bold; }
.math { font-style: italic; font-size: 13px; }
line, path, rect, circle, polygon { stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect width="500" height="340" fill="white"/>

<text x="250" y="25" text-anchor="middle" class="title">Fig. 2. Tetrahedral packet complex</text>
<polygon points="250,60 154.3,225.0 345.7,225.0"
  fill="rgba(26,58,107,0.06)" stroke="#1a3a6b" stroke-width="2"/>
<line x1="250" y1="60" x2="250" y2="186.5" stroke="#1a3a6b" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="154.3" y1="225.0" x2="250" y2="186.5" stroke="#1a3a6b" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="345.7" y1="225.0" x2="250" y2="186.5" stroke="#1a3a6b" stroke-width="1.5" stroke-dasharray="6,4"/>
<circle cx="250" cy="60" r="5" fill="#1a3a6b"/>
<circle cx="154.3" cy="225.0" r="5" fill="#1a5c3a"/>
<circle cx="345.7" cy="225.0" r="5" fill="#e65100"/>
<circle cx="250" cy="186.5" r="5" fill="#880e4f"/>
<text x="250" y="48" text-anchor="middle" class="math">v₀</text>
<text x="139.3" y="230.0" text-anchor="end" class="math">v₁</text>
<text x="360.7" y="230.0" text-anchor="start" class="math">v₂</text>
<text x="262" y="181.5" text-anchor="start" class="math">v₃</text>
<text x="60" y="310" class="small">V=4, E=6, F=4</text>
<text x="60" y="325" class="small">N = |S₄|×2³ = 192</text>
<text x="250" y="310" class="small">Δ = C(4,2)+1 = 7</text>
<text x="250" y="325" class="small">κ_C = 3/(4π) ≈ 0.239</text>
<text x="400" y="310" class="small">d_H = 3 (Moran)</text>
<text x="400" y="325" class="small">η_R = 185/192</text>

</svg>