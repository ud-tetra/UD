<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="310" viewBox="0 0 500 310">
<style>
text { font-family: serif; fill: #111; }
.label { font-size: 13px; }
.small { font-size: 11px; }
.title { font-size: 14px; font-weight: bold; }
.math { font-style: italic; font-size: 13px; }
line, path, rect, circle, polygon { stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect width="500" height="310" fill="white"/>

<text x="250" y="25" text-anchor="middle" class="title">Fig. 5. Lepton mass ladder: bare spine → dressed</text>
<g transform="translate(100,50)">
  <rect x="0" y="0" width="300" height="220" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <line x1="0" y1="180" x2="300" y2="180" stroke="#ddd" stroke-width="0.5"/>
  <line x1="0" y1="100" x2="300" y2="100" stroke="#ddd" stroke-width="0.5"/>
  <line x1="0" y1="20" x2="300" y2="20" stroke="#ddd" stroke-width="0.5"/>
  <text x="-10" y="185" text-anchor="end" class="small">e</text>
  <text x="-10" y="105" text-anchor="end" class="small">μ</text>
  <text x="-10" y="25" text-anchor="end" class="small">τ</text>
  <rect x="30" y="170" width="50" height="15" fill="#1a3a6b" opacity="0.7"/>
  <text x="55" y="195" text-anchor="middle" class="small">ν₀S₀</text>
  <rect x="120" y="87" width="50" height="15" fill="#1a3a6b" opacity="0.7"/>
  <rect x="120" y="104" width="50" height="3" fill="#e65100" opacity="0.8"/>
  <text x="145" y="115" text-anchor="middle" class="small">SH</text>
  <text x="185" y="100" class="small" fill="#e65100">+z_μ</text>
  <rect x="220" y="7" width="50" height="15" fill="#1a3a6b" opacity="0.7"/>
  <rect x="220" y="22" width="50" height="5" fill="#e65100" opacity="0.8"/>
  <text x="245" y="35" text-anchor="middle" class="small">SH²</text>
  <text x="285" y="20" class="small" fill="#e65100">+z_τ</text>
</g>
<text x="130" y="288" class="small" fill="#555">Blue: bare spine. Orange: dressing correction (exaggerated).</text>

</svg>