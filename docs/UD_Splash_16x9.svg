<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep space gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="40%" stop-color="#060e1a"/>
      <stop offset="100%" stop-color="#020508"/>
    </radialGradient>
    
    <!-- Tetrahedron glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#1a237e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Edge glow filter -->
    <filter id="edgeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Outer glow for text -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Star point filter -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#1a3a5c" stroke-width="0.3" stroke-opacity="0.15"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#1a3a5c" stroke-width="0.3" stroke-opacity="0.15"/>
    </pattern>
    
    <!-- Equation fade -->
    <linearGradient id="eqFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#4fc3f7" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#4fc3f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Accent line gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4fc3f7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#81d4fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="accentLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0a030" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e0a030" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#f0c060" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e0a030" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Scattered stars -->
  <g fill="#fff" opacity="0.4">
    <circle cx="120" cy="80" r="1"/><circle cx="340" cy="150" r="0.8"/>
    <circle cx="580" cy="60" r="1.2"/><circle cx="780" cy="200" r="0.6"/>
    <circle cx="1100" cy="90" r="1"/><circle cx="1350" cy="170" r="0.8"/>
    <circle cx="1600" cy="50" r="1.1"/><circle cx="1800" cy="130" r="0.7"/>
    <circle cx="200" cy="350" r="0.9"/><circle cx="1700" cy="400" r="1"/>
    <circle cx="100" cy="600" r="0.8"/><circle cx="1820" cy="650" r="0.9"/>
    <circle cx="250" cy="900" r="1"/><circle cx="1650" cy="950" r="0.7"/>
    <circle cx="450" cy="980" r="0.8"/><circle cx="1400" cy="1020" r="1.1"/>
    <circle cx="900" cy="50" r="0.6"/><circle cx="1050" cy="1000" r="0.8"/>
    <circle cx="50" cy="450" r="0.7"/><circle cx="1880" cy="300" r="0.9"/>
  </g>
  
  <!-- Central glow -->
  <ellipse cx="960" cy="460" rx="500" ry="400" fill="url(#glow)"/>
  
  <!-- TETRAHEDRON — the hero element -->
  <!-- Projected K₄ vertices -->
  <!-- v1=top, v2=bottom-left, v3=bottom-right, v4=center(depth) -->
  <g transform="translate(960, 430)" filter="url(#edgeGlow)">
    <!-- Back edges (dimmer) -->
    <line x1="0" y1="-190" x2="30" y2="10" stroke="#4fc3f7" stroke-width="1.2" opacity="0.3"/>
    <line x1="-175" y1="130" x2="30" y2="10" stroke="#4fc3f7" stroke-width="1.2" opacity="0.3"/>
    <line x1="175" y1="130" x2="30" y2="10" stroke="#4fc3f7" stroke-width="1.2" opacity="0.3"/>
    
    <!-- Front edges (brighter) -->
    <line x1="0" y1="-190" x2="-175" y2="130" stroke="#4fc3f7" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="-190" x2="175" y2="130" stroke="#4fc3f7" stroke-width="2" opacity="0.9"/>
    <line x1="-175" y1="130" x2="175" y2="130" stroke="#4fc3f7" stroke-width="2" opacity="0.9"/>
    
    <!-- Face fills (very subtle) -->
    <polygon points="0,-190 -175,130 175,130" fill="#4fc3f7" opacity="0.03"/>
    <polygon points="0,-190 -175,130 30,10" fill="#81d4fa" opacity="0.02"/>
    <polygon points="0,-190 175,130 30,10" fill="#81d4fa" opacity="0.02"/>
    <polygon points="-175,130 175,130 30,10" fill="#4fc3f7" opacity="0.025"/>
    
    <!-- Vertices (glowing dots) -->
    <circle cx="0" cy="-190" r="5" fill="#4fc3f7" opacity="0.9"/>
    <circle cx="0" cy="-190" r="12" fill="#4fc3f7" opacity="0.15"/>
    <circle cx="-175" cy="130" r="5" fill="#4fc3f7" opacity="0.9"/>
    <circle cx="-175" cy="130" r="12" fill="#4fc3f7" opacity="0.15"/>
    <circle cx="175" cy="130" r="5" fill="#4fc3f7" opacity="0.9"/>
    <circle cx="175" cy="130" r="12" fill="#4fc3f7" opacity="0.15"/>
    <circle cx="30" cy="10" r="4" fill="#81d4fa" opacity="0.7"/>
    <circle cx="30" cy="10" r="10" fill="#81d4fa" opacity="0.1"/>
    
    <!-- Vertex labels -->
    <text x="10" y="-200" font-family="Georgia, serif" font-size="16" fill="#81d4fa" opacity="0.6" text-anchor="middle">V=4</text>
    <text x="-195" y="155" font-family="Georgia, serif" font-size="16" fill="#81d4fa" opacity="0.6">E=6</text>
    <text x="185" y="155" font-family="Georgia, serif" font-size="16" fill="#81d4fa" opacity="0.6">F=4</text>
  </g>
  
  <!-- Orbiting equation ring (subtle, behind tetrahedron conceptually) -->
  <g opacity="0.12" transform="translate(960,440)">
    <ellipse cx="0" cy="0" rx="320" ry="80" fill="none" stroke="#4fc3f7" stroke-width="0.5" stroke-dasharray="4,8" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="280" ry="70" fill="none" stroke="#81d4fa" stroke-width="0.3" stroke-dasharray="3,12" transform="rotate(25)"/>
  </g>
  
  <!-- TITLE BLOCK -->
  <text x="960" y="720" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#e8e8e8" text-anchor="middle" letter-spacing="12" filter="url(#textGlow)">UNIFIED DYNAMICS</text>
  
  <!-- Accent line under title -->
  <rect x="560" y="738" width="800" height="1.5" fill="url(#accentLine)"/>
  
  <!-- Subtitle -->
  <text x="960" y="780" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#8ab4d4" text-anchor="middle" letter-spacing="8" font-style="italic">DISTINCTION THEORY</text>
  
  <!-- Tagline -->
  <text x="960" y="830" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#607d8b" text-anchor="middle" letter-spacing="3">One Tetrahedron · Zero Free Parameters · 17 Predictions</text>
  
  <!-- Gold accent line -->
  <rect x="720" y="850" width="480" height="0.8" fill="url(#accentLine2)"/>
  
  <!-- Key equations floating (very subtle, atmospheric) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#4fc3f7" opacity="0.18">
    <text x="140" y="280" font-size="15" transform="rotate(-5, 140, 280)">g² = (p+1)/π</text>
    <text x="1580" y="320" font-size="14" transform="rotate(3, 1580, 320)">sin²θ = 3/13</text>
    <text x="180" y="700" font-size="13" transform="rotate(-2, 180, 700)">α = 129/(112π²)</text>
    <text x="1520" y="680" font-size="14" transform="rotate(4, 1520, 680)">Q = 2/3</text>
    <text x="100" y="500" font-size="12" transform="rotate(-8, 100, 500)">ε = 2π - dπ/3 = π</text>
    <text x="1620" y="520" font-size="13" transform="rotate(6, 1620, 520)">A₄/V₄ = Z₃</text>
    <text x="250" y="870" font-size="12">ε* × |A₄| = 1/π</text>
    <text x="1480" y="850" font-size="12">43 = E² + E + 1</text>
  </g>
  
  <!-- Bottom bar -->
  <rect x="0" y="1040" width="1920" height="40" fill="#040810" opacity="0.8"/>
  <rect x="0" y="1040" width="1920" height="0.5" fill="url(#accentLine)"/>
  
  <!-- Author credit -->
  <text x="960" y="1065" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#607d8b" text-anchor="middle" letter-spacing="2">Benjamin Walker Mayes · Zenodo DOI: 10.5281/zenodo.19582493 · 2026</text>
  
  <!-- Corner accent marks -->
  <g stroke="#4fc3f7" stroke-width="1" opacity="0.3">
    <line x1="40" y1="30" x2="40" y2="60"/>
    <line x1="40" y1="30" x2="70" y2="30"/>
    <line x1="1880" y1="30" x2="1880" y2="60"/>
    <line x1="1880" y1="30" x2="1850" y2="30"/>
    <line x1="40" y1="1020" x2="40" y2="990"/>
    <line x1="40" y1="1020" x2="70" y2="1020"/>
    <line x1="1880" y1="1020" x2="1880" y2="990"/>
    <line x1="1880" y1="1020" x2="1850" y2="1020"/>
  </g>
</svg>
